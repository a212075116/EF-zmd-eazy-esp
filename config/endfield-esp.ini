# endfield-esp.ini — 与 exe 同目录，F7 热重载
enable    = true
corners   = true      # 四角括号框；boxes=true 且 corners=false 时画全框
boxes     = true
names     = true
dists     = true
snap      = false     # 屏幕底部中心到脚底的吸附线
maxDist   = 200       # 米
defHeight = 1.8       # Ent_Height 未配置时的身高
boxWidth  = 0.42      # 框宽 / 框高
mode      = view      # view=worldToCamera(多数Unity) / clip=VP矩阵(URP)

# ===== 数据源 =====
# GUI：运行 endfield_esp.exe 后按 F8 弹出控制台（滑条/勾选/实体清单，全部实时生效，可保存ini）
# ===== FileFeed 模式（RPM 被内核剥权时的零内存读取方案）=====
# 填 dumper 工具的输出目录（英文路径）；填了就走文件桥，完全不碰游戏内存
shm      = true                      # 共享内存实时feed（游戏内按 F4 开启后自动接管）
dump     = E:\Program Files
# include  =                          # 白名单：小写子串分号分隔；留空=按类型开关
# exclude =                           # 黑名单：优先级高于白名单（点过清单的实体除外）
attach = true               # 覆盖层只贴合游戏窗口客户区（false=整桌面）
fontSize = 14                         # 覆盖层文字字号(px)，GUI 滑条调节
# save = eny_0057_dog,255,80,80       # 书签行：名称,R,G,B（GUI 书签页维护，可多条）
showEnemy = true        # 红：EntityDataType Enemy（eny_* 都是）
showNpc   = true        # 黄：NPC
showOther = false       # 灰：采集物/交互件等（基地里非常多，按需开）
# feedMs   = 1500                    # 重读文件间隔
# feedFov  = 47                      # 覆盖 FOV（0=用相机文件/MainCamera 内建值）

# 可选覆盖：留注释则用 offsets.hpp 里的值（改这里免重编译）
# proc    = Endfield.exe
# module  = GameAssembly.dll
